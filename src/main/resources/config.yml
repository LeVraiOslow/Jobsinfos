# Dossier de config d'ExcellentJobs (vide = plugins/ExcellentJobs)
excellentjobs-folder: ""

# Taille (nombre de slots) du menu /jobs d'ExcellentJobs (generic_9x4 = 36).
# Sert a ne reagir que dans ce menu.
browse-menu-size: 36

# Dans les fichiers de job : "xp_min;xp_max argent_min;argent_max chance".
# Mets true si chez toi c'est l'inverse (argent d'abord).
swap-xp-and-money: false

currency-symbol: "$"

title: "<dark_gray>Infos • %job%"

entry:
  name: "<white><b>%name%</b>"
  lore:
    - "<gray>%category%"
    - ""
    - "<gold>▪ <gray>XP : <yellow>%xp%"
    - "<green>▪ <gray>Argent : <green>%money%%symbol%"
    - "%chance%"
  chance-line: "<aqua>▪ <gray>Chance : <aqua>%chance%%"

buttons:
  previous: "<orange><b>Page précédente"
  next: "<orange><b>Page suivante"
  back: "<red><b>Retour"
  page: "<gray>Page %page%/%pages%"

# Libelle affiche selon le type d'objectif du job.
categories:
  mining: "Casser ce bloc"
  gathering: "Récolter"
  killing: "Tuer ce monstre"
  fishing: "Pêcher"
  shearing: "Tondre"
  breeding: "Reproduire"
  milking: "Traire"
  default: "Objectif"
